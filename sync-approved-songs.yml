name: Sync Approved Songs to Songbook

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Runs automatically once daily at 07:30 IST

permissions:
  contents: write

jobs:
  sync-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight sync tools
        run: pip install -q yt-dlp youtube-transcript-api indic-transliteration

      - name: Fetch approved songs, run Copyright Gate & update packs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/fetch_and_publish_supabase.py

      - name: Commit & push updated song packs to main
        run: |
          git config user.name "QCoach Auto-Publisher"
          git config user.email "actions@github.com"
          git add packs/
          git diff --staged --quiet || (git commit -m "Auto-publish approved songs from Supabase queue" && git push)
