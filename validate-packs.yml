name: Validate QCoach Song Packs

on:
  push:
    branches: [ main ]
    paths:
      - 'packs/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packs/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all QCoach JSON Song Packs
        run: python scripts/validate_and_build_packs.py --packs-dir packs --check
